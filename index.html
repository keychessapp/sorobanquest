<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Soroban Quest</title>
<meta name="theme-color" content="#1b1140">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Soroban">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);--ink:#fff7e8;--accent:#ffc233;--panel:#2a1b57;--panel2:#3a2873}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:#150c33;color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{position:fixed;inset:0;background:radial-gradient(1200px 600px at 50% -10%,#3b2a85 0,#1b1140 55%,#0e0724 100%)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
.screen.on{display:flex}

/* ---------- map ---------- */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;flex:0 0 auto}
.logo{flex:1;font-size:20px;letter-spacing:.5px}
.logo b{color:var(--accent)}
.pill{background:rgba(255,255,255,.12);padding:7px 12px;border-radius:99px;font-weight:700;font-size:15px}
.icon{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);font-size:20px}
#mapScroll{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:relative}
#mapInner{position:relative}
#mapInner svg{position:absolute;left:0;top:0;pointer-events:none}
.trail-base{fill:none;stroke:rgba(255,255,255,.10);stroke-width:16;stroke-linecap:round}
.trail-done{fill:none;stroke:var(--accent);stroke-width:10;stroke-linecap:round;stroke-dasharray:1 18;opacity:.9}
.banner{position:absolute;left:50%;transform:translateX(-50%);padding:7px 16px;border-radius:99px;font-weight:800;font-size:14px;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);text-align:center}
.banner small{display:block;font-weight:600;opacity:.85;font-size:11px}
.node{position:absolute;width:66px;height:66px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;background:radial-gradient(circle at 35% 28%,var(--c) 0,var(--c2) 100%);box-shadow:0 6px 0 rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .15s}
.node:active{transform:translateY(3px)}
.node .num{position:absolute;left:-4px;top:-4px;min-width:24px;height:24px;border-radius:12px;background:#1b1140;border:2px solid var(--c);font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.node .pips{position:absolute;top:70px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.node .pips i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2)}
.node .pips i.f{background:var(--accent);box-shadow:0 0 6px var(--accent)}
.node.locked{background:#3b3560;--c:#6b6496;filter:grayscale(.6);opacity:.75;font-size:24px}
.node.cur::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:3px solid var(--accent);animation:ring 1.4s infinite}
@keyframes ring{0%{transform:scale(.88);opacity:1}100%{transform:scale(1.25);opacity:0}}
.node.shake{animation:shake .35s}
.installbar{position:absolute;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);background:var(--accent);color:#2a1b57;font-weight:800;padding:12px 20px;border-radius:99px;box-shadow:0 6px 20px rgba(0,0,0,.45)}
.installbar[hidden]{display:none}

/* ---------- game ---------- */
.gbar{display:flex;align-items:center;gap:10px;padding:8px 14px;flex:0 0 auto}
.gbar .icon{width:36px;height:36px;font-size:16px}
.gprog{flex:1;height:12px;background:rgba(255,255,255,.14);border-radius:8px;overflow:hidden}
#gFill{height:100%;width:0;background:linear-gradient(90deg,#34d399,#ffc233);border-radius:8px;transition:width .3s}
#gCount{font-weight:800;min-width:48px;text-align:right}
.gmeta{display:flex;justify-content:space-between;padding:0 16px;font-weight:700;font-size:14px;opacity:.9;flex:0 0 auto}
#problem{flex:0 0 auto;height:clamp(100px,25vh,230px);display:flex;align-items:center;justify-content:center;position:relative;padding:0 15px}
.stack{display:inline-grid;grid-template-columns:auto auto;column-gap:.45em;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.stack .sg{text-align:right;color:var(--accent)}
.stack .nm{text-align:right}
.stack .rule{grid-column:1/-1;height:3px;background:rgba(255,255,255,.35);border-radius:2px;margin-top:.15em}
.inline{font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(21,12,51,.9);font-size:1.3em;font-weight:800;color:var(--accent);animation:pop .25s}
#readout{text-align:center;font-weight:800;font-size:20px;height:26px;color:#9be7ff;font-variant-numeric:tabular-nums;flex:0 0 auto}
#readout[hidden]{display:block;visibility:hidden}
#abWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 8px}
.gbtns{display:flex;gap:10px;padding:10px 14px 14px;flex:0 0 auto}
.btn{height:56px;border-radius:18px;font-weight:800;font-size:17px;background:var(--panel2);box-shadow:0 5px 0 rgba(0,0,0,.35);padding:0 18px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.btn.main{flex:1;background:linear-gradient(180deg,#4ade80,#16a34a);font-size:20px}
.btn[hidden]{display:none}
.btn.sm{height:48px;font-size:15px}

/* ---------- abacus ---------- */
body{--f1:#c58443;--f2:#7c4a22;--board:#2b1a10;--beam1:#a8683a;--beam2:#6b3d1c}
body[data-theme=jade]{--f1:#4cc9a0;--f2:#1d7a63;--board:#0f2a26;--beam1:#2fa97c;--beam2:#145a47}
body[data-theme=neon]{--f1:#7a5cff;--f2:#2b1b8a;--board:#0a0620;--beam1:#6b4cff;--beam2:#2b1b8a}
body[data-theme=gold]{--f1:#ffd76a;--f2:#b8801a;--board:#2a1f08;--beam1:#e6b23a;--beam2:#9a6a10}
.abacus{--bh:40px;border-radius:20px;padding:10px;background:linear-gradient(145deg,var(--f1),var(--f2));box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.3)}
.board{position:relative;display:flex;background:var(--board);border-radius:10px;box-shadow:inset 0 5px 12px rgba(0,0,0,.65)}
.rod{flex:1;position:relative;display:flex;flex-direction:column;padding:calc(var(--bh)*.25) 0}
.rod::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:6px;margin-left:-3px;background:linear-gradient(90deg,#7a6a42,#f4e4b0,#7a6a42);border-radius:3px}
.hz{position:relative;height:calc(var(--bh)*2);touch-action:none}
.gap{height:calc(var(--bh)*.45)}
.ez{position:relative;height:calc(var(--bh)*5);touch-action:none}
.beam{position:absolute;left:0;right:0;top:calc(var(--bh)*2.25);height:calc(var(--bh)*.45);background:linear-gradient(180deg,var(--beam1),var(--beam2));box-shadow:0 2px 4px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35);z-index:1;pointer-events:none}
.beam i{position:absolute;top:50%;width:7px;height:7px;border-radius:50%;background:#fff;opacity:.85;transform:translate(-50%,-50%)}
.beam i.one{width:10px;height:10px;background:#ffc233;opacity:1}
.bead{position:absolute;left:5%;right:5%;top:0;height:calc(var(--bh) - 3px);margin-top:1.5px;border-radius:50%;pointer-events:none;will-change:transform;transition:transform .14s cubic-bezier(.3,1.5,.5,1);
 background:radial-gradient(ellipse 55% 35% at 38% 24%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%),linear-gradient(180deg,var(--c1),var(--c2));
 box-shadow:inset 0 -4px 6px rgba(0,0,0,.28),0 2px 4px rgba(0,0,0,.45)}
.rod.hint::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 2px rgba(255,236,150,.95),inset 0 0 20px rgba(255,220,100,.55);animation:pulse 1s infinite;pointer-events:none;z-index:2}
.places{display:flex;margin-top:6px;height:14px}
.places span{flex:1;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.75);text-shadow:0 1px 1px rgba(0,0,0,.5)}
.abacus.ok{animation:okflash .6s}
.abacus.shake{animation:shake .35s}
@keyframes okflash{0%{filter:brightness(1)}30%{filter:brightness(1.5) saturate(1.4)}100%{filter:brightness(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- sheets & misc ---------- */
.sheet-back{position:fixed;inset:0;background:rgba(5,2,20,.62);display:none;align-items:flex-end;justify-content:center;z-index:50}
.sheet-back.on{display:flex}
.sheet{width:min(520px,100%);max-height:92%;overflow-y:auto;background:var(--panel);border-radius:28px 28px 0 0;padding:20px 18px calc(18px + var(--safe-b));animation:up .25s ease-out;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sh-head{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.bigicon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;background:var(--c);flex:0 0 auto}
.sh-sub{font-size:13px;opacity:.75;font-weight:700}
.sheet h2{margin:2px 0 0;font-size:20px;line-height:1.2}
.sheet h3{margin:14px 0 8px;font-size:15px;opacity:.8}
.sample{background:rgba(0,0,0,.28);border-radius:14px;padding:12px;text-align:center;font-weight:800;font-size:20px;margin:6px 0;font-variant-numeric:tabular-nums}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 2px;font-weight:700;font-size:15px}
.dim{opacity:.2}
.chips{display:flex;gap:8px}
.chip{flex:1;height:46px;border-radius:14px;background:var(--panel2);font-weight:800;font-size:17px}
.chip.sel{background:var(--accent);color:#2a1b57;box-shadow:0 0 0 3px rgba(255,194,51,.35)}
.chip.lock{opacity:.45}
.note{font-size:13px;opacity:.75;margin:8px 0 14px;line-height:1.4}
.go{width:100%;height:58px;border-radius:18px;font-size:20px;font-weight:800;background:linear-gradient(180deg,#4ade80,#16a34a);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.go.alt{background:var(--panel2);margin-top:10px;height:50px;font-size:16px}
.go:active{transform:translateY(3px)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;font-weight:700}
.tg input{display:none}
.tg i{width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.2);position:relative;transition:.2s}
.tg i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.tg input:checked+i{background:#16a34a}
.tg input:checked+i::after{left:23px}
.res-ring{width:130px;height:130px;border-radius:50%;margin:6px auto 12px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.stat{background:rgba(0,0,0,.25);border-radius:14px;padding:10px;text-align:center;font-weight:800;font-size:18px}
.stat small{display:block;font-size:11px;opacity:.7;font-weight:700}
.center{text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.cf{position:absolute;top:-30px;animation:fall 2.1s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg)}}
.fl{position:absolute;font-weight:900;font-size:26px;color:var(--accent);text-shadow:0 2px 6px rgba(0,0,0,.6);animation:rise 1s ease-out forwards;pointer-events:none}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%) translateY(20px);background:#000c;padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;opacity:0;transition:.25s;z-index:120;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body data-theme="wood">
<div id="app">
  <section id="map" class="screen on">
    <header class="top">
      <div class="logo"><b>Soroban</b> Quest</div>
      <div class="pill" id="beadsPill">◉ 0</div>
      <button class="icon" id="btnSettings" aria-label="Settings">⚙️</button>
    </header>
    <div id="mapScroll"><div id="mapInner"></div></div>
    <button id="installBar" class="installbar" hidden>📲 Install app</button>
  </section>

  <section id="game" class="screen">
    <header class="gbar">
      <button class="icon" id="gBack" aria-label="Back">✕</button>
      <div class="gprog"><div id="gFill"></div></div>
      <div id="gCount">1/10</div>
    </header>
    <div class="gmeta"><span id="gLevel"></span><span id="gStreak">🔥 0</span><span id="gBeads">◉ 0</span></div>
    <div id="problem"></div>
    <div id="readout" hidden></div>
    <div id="abWrap"></div>
    <div class="gbtns">
      <button class="btn" id="bClear" aria-label="Clear beads">↺</button>
      <button class="btn" id="bHint" aria-label="Hint">💡</button>
      <button class="btn sm" id="bSkip" hidden>Skip ⏭</button>
      <button class="btn main" id="bCheck">✓ Check</button>
    </div>
  </section>
</div>

<div id="sheetBack" class="sheet-back"><div class="sheet" id="sheet"></div></div>
<div id="fx"></div>
<div id="toast"></div>

<script>
//ENGINE-START
const MAXV = 999999;
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pw = d => Math.pow(10, d);
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '\u2009');
const MINUS = '\u2212';

/* number with (mostly) exactly d digits, never above hi, never below 1 */
function num(d, hi = MAXV, allowShort = true) {
  if (d > 1 && allowShort && Math.random() < 0.2) d--;
  hi = Math.min(pw(d) - 1, hi);
  if (hi < 1) return 1;
  const lo = Math.min(d === 1 ? 1 : pw(d - 1), hi);
  return rnd(lo, hi);
}
const lowOf = d => (d === 1 ? 1 : pw(d - 1));
function mk(terms) {
  let total = 0;
  terms.forEach(([sg, v]) => (total += sg * v));
  return { kind: 'stack', terms, answer: total };
}

function genAdd(s) {
  if (s.carry) { const a = rnd(2, 9), b = rnd(10 - a, 9); return mk([[1, a], [1, b]]); }
  const cap = s.cap || MAXV, terms = [];
  let sum = 0;
  for (let i = 0; i < s.t; i++) {
    const hi = Math.floor((cap - sum) / (s.t - i));
    const v = Math.max(1, num(s.d, hi));
    terms.push([1, v]); sum += v;
  }
  return mk(terms);
}
function genSub(s) {
  const da = Math.min(6, s.d + (s.t >= 3 ? 1 : 0));
  let a = num(da, MAXV, false);
  if (a < s.t + 1) a = rnd(s.t + 1, 9);
  const terms = [[1, a]];
  let run = a;
  for (let i = 1; i < s.t; i++) {
    const rem = s.t - i;
    const hi = Math.min(pw(s.d) - 1, run - rem);
    if (hi < 1) break;
    const v = rnd(Math.min(lowOf(s.d), hi), hi);
    terms.push([-1, v]); run -= v;
  }
  return mk(terms);
}
function genMix(s) {
  for (let tries = 0; tries < 60; tries++) {
    let run = num(s.d, Math.floor(MAXV * 0.6), false);
    if (run < 3) continue;
    const signs = [];
    for (let i = 1; i < s.t; i++) signs.push(Math.random() < 0.5 ? -1 : 1);
    if (!signs.includes(-1) || !signs.includes(1)) continue;
    const terms = [[1, run]];
    for (let i = 0; i < signs.length; i++) {
      let sg = signs[i];
      if (sg < 0 && run - 1 < 1) sg = 1;
      if (sg > 0 && MAXV - run < 1) sg = -1;
      const hi = sg < 0 ? run - 1 : MAXV - run;
      const v = num(s.d, hi);
      terms.push([sg, v]); run += sg * v;
    }
    return mk(terms);
  }
  return genAdd({ t: s.t, d: s.d });
}
const numMul = d => (d === 1 ? rnd(2, 9) : Math.max(2, num(d, MAXV, true)));
function genMul(s) {
  let a, b;
  do { a = numMul(s.d1); b = numMul(s.d2); } while (a * b > MAXV);
  return { kind: 'inline', text: `${fmt(a)} \u00d7 ${fmt(b)}`, answer: a * b };
}
function genMulAdd(s) {
  let a, b;
  do { a = numMul(s.d1); b = numMul(s.d2); } while (a * b > MAXV - 1);
  const p = a * b, c = num(s.dc, MAXV - p);
  return { kind: 'inline', text: `${fmt(a)} \u00d7 ${fmt(b)} + ${fmt(c)}`, answer: p + c };
}
function genMulSub(s) {
  let a, b;
  do { a = numMul(s.d1); b = numMul(s.d2); } while (a * b > MAXV || a * b < 6);
  const p = a * b, c = num(s.dc, p - 1);
  return { kind: 'inline', text: `${fmt(a)} \u00d7 ${fmt(b)} ${MINUS} ${fmt(c)}`, answer: p - c };
}
function genProblem(s) {
  switch (s.op) {
    case 'add': return genAdd(s);
    case 'sub': return genSub(s);
    case 'mix': return genMix(s);
    case 'mul': return genMul(s);
    case 'mulAdd': return genMulAdd(s);
    case 'mulSub': return genMulSub(s);
    case 'master': return genProblem(s.pool[rnd(0, s.pool.length - 1)]);
  }
}
/* "work units" = how many rod-digit operations a typical problem needs */
function work(s) {
  switch (s.op) {
    case 'add': return s.t * s.d * (s.carry ? 1.3 : 1);
    case 'sub': return 1.25 * s.t * s.d;
    case 'mix': return 1.4 * s.t * s.d;
    case 'mul': return 2.2 * s.d1 * s.d2;
    case 'mulAdd': case 'mulSub': return 2.2 * s.d1 * s.d2 + 1.3 * s.dc;
    case 'master': return s.pool.reduce((a, p) => a + work(p), 0) / s.pool.length;
  }
}
const secPerProblem = s => 3 + 1.2 * work(s);          // time model: 3s overhead + 1.2s per work unit
const flames = w => Math.min(5, Math.max(1, Math.ceil(w / 8)));

const WORLDS = [
  { n: 'Add Garden',      c: '#34d399', c2: '#047857', ic: ['🌱', '🌿', '🌷', '🌻', '🌳'] },
  { n: 'Take-Away Trail', c: '#fb923c', c2: '#b45309', ic: ['🍂', '🍁', '🍄', '🌰', '🎃'] },
  { n: 'Mix Mountain',    c: '#a78bfa', c2: '#5b21b6', ic: ['🪨', '⛰️', '🏔️', '🗻', '🌋'] },
  { n: 'Big Number Bay',  c: '#38bdf8', c2: '#0369a1', ic: ['🐚', '🦀', '🐠', '🐬', '🐳'] },
  { n: 'Times Temple',    c: '#f87171', c2: '#991b1b', ic: ['⛩️', '🏮', '🐉', '🎎', '🏯', '🐲', '🎋'] },
  { n: 'Master Dojo',     c: '#fbbf24', c2: '#92400e', ic: ['🥋', '🥷', '🏆', '💎', '👑'] },
];
const SPECS = [
  { w: 0, op: 'add', t: 2, d: 1, cap: 9, txt: 'Add two tiny numbers (answer up to 9)' },
  { w: 0, op: 'add', t: 2, d: 1, carry: true, txt: 'Add two digits and carry to the tens' },
  { w: 0, op: 'add', t: 3, d: 1, txt: 'Add three single digits' },
  { w: 0, op: 'add', t: 2, d: 2, txt: 'Add two 2-digit numbers' },
  { w: 0, op: 'add', t: 3, d: 2, txt: 'Add three 2-digit numbers' },
  { w: 1, op: 'sub', t: 2, d: 1, txt: 'Take away a single digit' },
  { w: 1, op: 'sub', t: 2, d: 2, txt: 'Subtract 2-digit numbers' },
  { w: 1, op: 'sub', t: 3, d: 2, txt: 'Subtract two numbers in a row' },
  { w: 1, op: 'sub', t: 2, d: 3, txt: 'Subtract 3-digit numbers' },
  { w: 1, op: 'sub', t: 3, d: 3, txt: 'Two 3-digit subtractions in a row' },
  { w: 2, op: 'mix', t: 3, d: 2, txt: 'Plus and minus, 2 digits' },
  { w: 2, op: 'mix', t: 3, d: 3, txt: 'Plus and minus, 3 digits' },

class Abacus {
  constructor(host, n, onChange) {
    this.n = n; this.onChange = onChange; this.bh = 40; this.enabled = true; this.hintTarget = null;
    this.st = Array.from({ length: n }, () => ({ h: 0, e: 0 }));
    host.innerHTML = '';
    this.root = el('div', 'abacus');
    this.board = el('div', 'board');
    this.rods = [];
    for (let i = 0; i < n; i++) {
      const rod = el('div', 'rod'), hz = el('div', 'hz'), gap = el('div', 'gap'), ez = el('div', 'ez');
      const hb = el('div', 'bead'); hz.appendChild(hb);
      const eb = [0, 1, 2, 3].map(() => { const b = el('div', 'bead'); ez.appendChild(b); return b; });
      rod.append(hz, gap, ez);
      this.board.appendChild(rod);
      this.rods.push({ rod, hb, eb });
      this.bindHeaven(hz, i); this.bindEarth(ez, i);
    }
    const beam = el('div', 'beam');
    for (let i = 0; i < n; i++) {
      const d = el('i', i === n - 1 ? 'one' : ''); d.style.left = ((i + 0.5) / n * 100) + '%'; beam.appendChild(d);
    }
    this.board.appendChild(beam);
    const places = el('div', 'places');
    const names = ['100k', '10k', '1k', '100', '10', '1'];
    for (let i = 0; i < n; i++) places.appendChild(el('span', '', names[6 - n + i] || ''));
    this.root.append(this.board, places);
    host.appendChild(this.root);
    this.recolor();
  }
  get value() { return this.st.reduce((a, r, i) => a + (r.h * 5 + r.e) * pw(this.n - 1 - i), 0); }
  digits() { return this.st.map(r => r.h * 5 + r.e); }
  fit(w, h) {
    const frameW = Math.min(w, 560), colW = (frameW - 20) / this.n;
    const byH = (h - 20 - 20 - 8) / 7.95;
    this.bh = Math.max(14, Math.min(byH, colW * 0.9, 66));
    this.root.style.setProperty('--bh', this.bh + 'px');
    this.root.style.width = Math.floor(colW * this.n + 20) + 'px';
    this.render();
  }
  recolor() {
    const pal = PAL[S.theme] || PAL.wood;
    this.rods.forEach((r, i) => {
      const [c1, c2] = pal[(this.n - 1 - i) % pal.length];
      r.rod.style.setProperty('--c1', c1); r.rod.style.setProperty('--c2', c2);
    });
  }
  render() {
    const bh = this.bh;
    this.st.forEach((s, i) => {
      const r = this.rods[i];
      r.hb.style.transform = `translateY(${s.h * bh}px)`;
      r.eb.forEach((b, k) => { b.style.transform = `translateY(${(k < s.e ? k : k + 1) * bh}px)`; });
    });
    this.updateHint();
  }
  changed(delta) {
    this.render();
    clack(); if (delta > 1) setTimeout(clack, 55);
    buzz(delta > 1 ? [8, 30, 8] : 8);
    if (this.onChange) this.onChange(this.value);
  }
  setE(i, e) { const s = this.st[i]; if (s.e === e) return; const d = Math.abs(e - s.e); s.e = e; this.changed(d); }
  setH(i, h) { const s = this.st[i]; if (s.h === h) return; s.h = h; this.changed(1); }

    let down = false, k = -1, sy = 0, togE = 0;

      if (!this.enabled) return;
      ev.preventDefault(); z.setPointerCapture(ev.pointerId);
      const slot = clamp(Math.floor((ev.clientY - z.getBoundingClientRect().top) / this.bh), 0, 4);
      k = earthGrab(this.st[i].e, slot); if (k < 0) return;
      down = true; sy = ev.clientY;

  bindHeaven(z, i) {
    let down = false, sy = 0, tog = 0;
    z.addEventListener('pointerdown', ev => {

      down = true; sy = ev.clientY; tog = this.st[i].h ? 0 : 1; this.setH(i, tog);
    });
    z.addEventListener('pointermove', ev => {

  }

  }

function curve(p) {
  if (p.length < 2) return '';
  let d = `M${p[0].x},${p[0].y}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    d += ` C${p1.x + (p2.x - p0.x) / 6},${p1.y + (p2.y - p0.y) / 6} ${p2.x - (p3.x - p1.x) / 6},${p2.y - (p3.y - p1.y) / 6} ${p2.x},${p2.y}`;
  }
  return d;
}

    if (cl < t.need) { toast(`Clear ${t.need} levels to unlock ${t.n}`); return; }
    S.theme = t.id; save(); applyTheme();
    document.querySelectorAll('#sheet .chip[data-t]').forEach(x => x.classList.toggle('sel', x === c));
  });
  if ($('#oInstall')) $('#oInstall').onclick = installApp;
  $('#oReset').onclick = () => { if (confirm('Erase all progress?')) { S = defaults(); save(); applyTheme(); goMap(0); } };
  $('#oClose').onclick = closeSheet;
}
function applyTheme() { document.body.dataset.theme = S.theme; if (ab) ab.recolor(); }
async function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; $('#installBar').hidden = true; closeSheet();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (!standalone) $('#installBar').hidden = false; });
window.addEventListener('appinstalled', () => { $('#installBar').hidden = true; deferredPrompt = null; });
$('#installBar').onclick = installApp;
$('#btnSettings').onclick = openSettings;

/* ======================= GAME ======================= */
let ab = null, G = null;
function applyReadout() { const r = $('#readout'); r.hidden = !S.showValue; r.textContent = ab ? fmt(ab.value) : '0'; }
function onAbChange(v) {
  if (S.showValue) $('#readout').textContent = fmt(v);
  if (S.auto && G && G.cur && !G.lock && v === G.cur.p.answer) {
    const cur = G.cur;   // short pause so the last bead is seen landing
    setTimeout(() => { if (G && G.cur === cur && !G.lock && ab.value === cur.p.answer) check(); }, 220);
  }
}
function ensureAbacus() {
  const w = $('#abWrap');
  if (!ab) ab = new Abacus(w, 6, onAbChange);
  ab.fit(w.clientWidth - 16, w.clientHeight); ab.recolor();
}
function fitProblem(p) {
  const box = $('#problem'), h = box.clientHeight - 10, w = box.clientWidth - 30; let fs;
  if (p.kind === 'stack') {
    const n = p.terms.length, maxLen = Math.max(...p.terms.map(t => fmt(t[1]).length));
    fs = Math.min(46, h / (n * 1.15 + 0.3), w / ((maxLen + 2) * 0.62));
  } else fs = Math.min(48, w / (p.text.length * 0.6));
  box.style.fontSize = Math.max(20, fs) + 'px';
}
function renderProblem(p) {
  const box = $('#problem');
  if (p.kind === 'stack') {
    box.innerHTML = '<div class="stack">' + p.terms.map(([sg, v], i) =>
      `<span class="sg">${i === 0 ? '' : sg > 0 ? '+' : MINUS}</span><span class="nm">${fmt(v)}</span>`).join('') + '<i class="rule"></i></div>';
  } else box.innerHTML = `<div class="inline">${p.text}</div>`;
  fitProblem(p);
}
function updateHud() {
  $('#gCount').textContent = Math.min(G.n + 1, G.size) + '/' + G.size;
  $('#gFill').style.width = (G.n / G.size * 100) + '%';
  $('#gStreak').textContent = '🔥 ' + G.streak;
  $('#gBeads').textContent = '◉ ' + G.pts;
}
function startSet(i, size) {
  S.size = size; save();
  G = { i, size, recent: [], n: 0, clean: 0, streak: 0, best: 0, pts: 0, times: [], cur: null, t0: 0, lock: false };
  $('#gLevel').textContent = `Level ${i + 1} · ${sets(i)}/3 sets`;
  show('game'); ensureAbacus(); nextProblem();
}
function nextProblem() {
  if (!G) return;
  if (G.n >= G.size) return finishSet();
  let p, key, tries = 0;                       // never repeat any of the last 6 problems
  do { p = genProblem(LEVELS[G.i]); key = pkey(p); tries++; } while (G.recent.includes(key) && tries < 60);
  G.recent.push(key); if (G.recent.length > 6) G.recent.shift();
  G.cur = { p, missed: false, hinted: false, miss: 0 }; G.t0 = performance.now(); G.lock = false; ab.enabled = true;
  renderProblem(p); ab.setHint(null); ab.st.forEach(s => { s.h = 0; s.e = 0; }); ab.render(); applyReadout();
  $('#bSkip').hidden = true; updateHud();
}
function floatText(txt) {
  const r = ab.root.getBoundingClientRect(), f = el('div', 'fl', txt);
  f.style.left = (r.left + r.width / 2 - 30) + 'px'; f.style.top = (r.top + 10) + 'px'; $('#fx').appendChild(f); setTimeout(() => f.remove(), 1000);
}
function check() {
  if (!G || G.lock) return;
  const c = G.cur;
  if (ab.value === c.p.answer) {
    G.lock = true; ab.enabled = false; G.times.push((performance.now() - G.t0) / 1000);
    const clean = !c.missed && !c.hinted;
    if (clean) { G.clean++; G.streak++; G.best = Math.max(G.best, G.streak); const add = Math.round(work(LEVELS[G.i])); G.pts += add; floatText('+' + add + ' ◉'); }
    else { G.streak = 0; floatText('✓'); }
    G.n++; updateHud(); sOK(); buzz([15, 40, 15]);
    ab.root.classList.remove('ok'); void ab.root.offsetWidth; ab.root.classList.add('ok');
    setTimeout(nextProblem, clean ? 650 : 900);
  } else {
    c.missed = true; c.miss++; G.streak = 0; updateHud(); sBad(); buzz([60, 40, 60]);
    ab.root.classList.remove('shake'); void ab.root.offsetWidth; ab.root.classList.add('shake');
    $('#bSkip').hidden = false;
    if (c.miss >= 2 && !c.hinted) { c.hinted = true; ab.setHint(c.p.answer); toast('💡 Highlighted rods need a change'); }
    else toast('Not yet, check the rods again');
  }
}
function skip() {
  if (!G || G.lock) return;
  G.lock = true; ab.enabled = false; G.times.push((performance.now() - G.t0) / 1000); G.streak = 0; G.n++;
  const r = el('div', 'reveal', '= ' + fmt(G.cur.p.answer)); $('#problem').appendChild(r); updateHud();
  setTimeout(nextProblem, 1500);
}
$('#bCheck').onclick = check;
$('#bSkip').onclick = skip;
$('#bClear').onclick = () => { if (G && !G.lock) { ab.clear(); buzz(10); } };
$('#bHint').onclick = () => { if (G && !G.lock) { G.cur.hinted = true; ab.setHint(G.cur.p.answer); toast('💡 Highlighted rods need a change'); } };
$('#gBack').onclick = () => {
  if (G && G.n > 0 && !confirm('Leave this set? Your progress in this set will be lost.')) return;
  G = null; goMap();
};

function finishSet() {
  const i = G.i, L = LV(i), before = L.sets, clBefore = cleared();
  const acc = G.clean / G.size, pass = acc >= 0.8;
  if (pass) L.sets = Math.min(3, L.sets + 1);
  L.best = Math.max(L.best || 0, acc); S.beads += G.pts; save();
  const justCleared = pass && before < 3 && L.sets >= 3;
  const newTheme = justCleared && THEMES.find(t => t.need > clBefore && t.need <= cleared());
  const avg = G.times.length ? (G.times.reduce((a, b) => a + b, 0) / G.times.length) : 0;
  const hue = Math.round(acc * 120);
  const nextLevel = i + 1 < LEVELS.length ? i + 1 : null;
  let title, sub, main, mainAct;
  if (justCleared) { title = i + 1 === LEVELS.length ? '👑 You are a Soroban Master!' : '🎉 Level cleared!'; sub = nextLevel != null ? `Level ${nextLevel + 1} is unlocked` : 'All 30 levels done'; main = 'Continue ▶'; mainAct = () => goMap(nextLevel != null ? nextLevel : i, nextLevel); }
  else if (pass && L.sets < 3) { title = '✅ Set complete!'; sub = `Sets cleared: ${L.sets} of 3`; main = 'Next set ▶'; mainAct = () => { closeSheet(); startSet(i, G.size); }; }
  else if (pass) { title = '✅ Nice practice!'; sub = 'This level was already cleared'; main = 'Play again ▶'; mainAct = () => { closeSheet(); startSet(i, G.size); }; }
  else { title = '💪 Almost there'; sub = 'You need 80% first-try answers. Try again!'; main = 'Try again ▶'; mainAct = () => { closeSheet(); startSet(i, G.size); }; }
  const html = `
    <h2 class="center">${title}</h2><div class="note center">${sub}</div>
    <div class="res-ring" style="background:conic-gradient(hsl(${hue} 80% 55%) ${acc * 360}deg,rgba(255,255,255,.15) 0)"><div style="width:100px;height:100px;border-radius:50%;background:var(--panel);display:flex;align-items:center;justify-content:center">${Math.round(acc * 100)}%</div></div>
    <div class="stats">
      <div class="stat">${G.clean}/${G.size}<small>first-try</small></div>
      <div class="stat">${avg.toFixed(1)}s<small>avg per problem</small></div>
      <div class="stat">🔥 ${G.best}<small>best streak</small></div>
      <div class="stat">+${G.pts} ◉<small>beads earned</small></div>
    </div>
    <div class="center" style="font-size:22px;margin-bottom:10px">${[0, 1, 2].map(k => k < L.sets ? '🟡' : '⚪').join(' ')}</div>
    ${newTheme ? `<div class="note center">🎨 New abacus style unlocked: <b>${newTheme.n}</b></div>` : ''}
    <button class="go" id="rMain">${main}</button>
    ${justCleared ? '' : '<button class="go alt" id="rMap">Map</button>'}`;
  G.lock = true;
  setTimeout(() => {
    openSheet(html, false);
    if (pass) { confetti(justCleared ? 90 : 40); justCleared ? sWin() : sOK(); buzz([30, 50, 30, 50, 80]); } else sBad();
    $('#rMain').onclick = () => { if (justCleared) G = null; mainAct(); };
    if ($('#rMap')) $('#rMap').onclick = () => { G = null; goMap(i); };
  }, 500);
}

/* ---- boot ---- */
window.addEventListener('resize', () => {
  if ($('#game').classList.contains('on') && ab) { ab.fit($('#abWrap').clientWidth - 16, $('#abWrap').clientHeight); if (G && G.cur) fitProblem(G.cur.p); }
  else if ($('#map').classList.contains('on')) { const sc = $('#mapScroll'), t = sc.scrollTop; renderMap(); sc.scrollTop = t; }
});
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
applyTheme(); goMap();
</script>
</body>
